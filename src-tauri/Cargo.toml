[package]
name = "windows-port-manager"
version = "0.1.0"
description = "Cross-platform developer port manager"
authors = ["WindowsPortManager"]
edition = "2021"

[lib]
name = "windows_port_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
netstat2 = "0.11.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.3"
tauri = { version = "2", features = [] }
thiserror = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
